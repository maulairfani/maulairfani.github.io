<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grain-attend" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#e8dfd3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="280" fill="#38312a"/>
  <rect width="640" height="280" fill="url(#grain-attend)"/>

  <!-- Header strip -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="1.5">
