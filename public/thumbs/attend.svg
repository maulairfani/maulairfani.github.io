  <line x1="330" y1="62" x2="330" y2="220" stroke="#e8dfd3" stroke-width="0.5" opacity="0.18"/>

  <!-- RIGHT: attendance log table -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10">
    <!-- column headers -->
    <text x="360" y="80" fill="#8a8178" letter-spacing="1.5" font-size="9">TIME</text>
    <text x="440" y="80" fill="#8a8178" letter-spacing="1.5" font-size="9">NAME</text>
    <text x="600" y="80" text-anchor="end" fill="#8a8178" letter-spacing="1.5" font-size="9">STATUS</text>
    <line x1="360" y1="88" x2="600" y2="88" stroke="#8a8178" stroke-width="0.5" opacity="0.35"/>

    <!-- rows -->
    <text x="360" y="110" fill="#d98b5f">14:32</text>
    <text x="440" y="110" fill="#d98b5f">Irfani</text>
    <text x="600" y="110" text-anchor="end" fill="#d98b5f">✓ IN</text>

    <text x="360" y="134" fill="#e8dfd3">14:31</text>
    <text x="440" y="134" fill="#e8dfd3">Rina</text>
    <text x="600" y="134" text-anchor="end" fill="#e8dfd3">✓ IN</text>

    <text x="360" y="158" fill="#e8dfd3">14:30</text>
    <text x="440" y="158" fill="#e8dfd3">Arif</text>
    <text x="600" y="158" text-anchor="end" fill="#e8dfd3">✓ IN</text>

    <text x="360" y="182" fill="#e8dfd3">14:28</text>
    <text x="440" y="182" fill="#e8dfd3">Dewi</text>
    <text x="600" y="182" text-anchor="end" fill="#e8dfd3">✓ IN</text>

    <text x="360" y="206" fill="#8a8178" opacity="0.6">14:26</text>
    <text x="440" y="206" fill="#8a8178" opacity="0.6">Budi</text>
    <text x="600" y="206" text-anchor="end" fill="#8a8178" opacity="0.6">✓ IN</text>
  </g>

  <!-- Footer strip -->
  <line x1="30" y1="232" x2="610" y2="232" stroke="#e8dfd3" stroke-width="0.5" opacity="0.18"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8a8178" letter-spacing="1.5">
    <text x="30" y="252">TODAY · 42 / 58</text>
    <text x="610" y="252" text-anchor="end">FACENET512 · YOLO11n</text>
