<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grain-envel" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#e8dfd3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="280" fill="#38312a"/>
  <rect width="640" height="280" fill="url(#grain-envel)"/>

  <!-- Header strip -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="1.5">
    <text x="30" y="34" fill="#8a8178">ENVELOPE BUDGETING</text>
    <text x="610" y="34" text-anchor="end" fill="#8a8178">APR · 2026</text>
  </g>
  <line x1="30" y1="48" x2="610" y2="48" stroke="#e8dfd3" stroke-width="0.5" opacity="0.18"/>

  <!-- LEFT COLUMN: budget categories -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="10">
    <text x="30" y="76" fill="#8a8178">RUMAH</text>
    <text x="260" y="76" text-anchor="end" fill="#e8dfd3">2.400.000</text>

    <text x="30" y="100" fill="#8a8178">MAKAN</text>
    <text x="260" y="100" text-anchor="end" fill="#e8dfd3">1.800.000</text>

    <text x="30" y="124" fill="#d98b5f">TABUNGAN</text>
    <text x="260" y="124" text-anchor="end" fill="#d98b5f">5.000.000</text>

    <text x="30" y="148" fill="#8a8178">TRANSPORT</text>
    <text x="260" y="148" text-anchor="end" fill="#e8dfd3">800.000</text>

    <text x="30" y="172" fill="#8a8178">HIBURAN</text>
    <text x="260" y="172" text-anchor="end" fill="#e8dfd3">600.000</text>

    <text x="30" y="196" fill="#8a8178">DARURAT</text>
    <text x="260" y="196" text-anchor="end" fill="#e8dfd3">3.000.000</text>
  </g>

  <!-- Divider between columns -->
  <line x1="300" y1="62" x2="300" y2="212" stroke="#e8dfd3" stroke-width="0.5" opacity="0.18"/>

  <!-- RIGHT: featured envelope -->
  <g transform="translate(340, 70)">
    <rect x="0" y="0" width="260" height="152" fill="#38312a" stroke="#e8dfd3" stroke-width="2"/>
    <!-- shallower flap so it doesn't crowd the amount -->
    <path d="M0 0 L130 58 L260 0" fill="none" stroke="#e8dfd3" stroke-width="1.6"/>

    <!-- stamp (filled to mask flap line behind it) -->
    <rect x="196" y="12" width="50" height="22" fill="#38312a" stroke="#d98b5f" stroke-width="1"/>
    <text x="221" y="27" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#d98b5f" letter-spacing="1.2">MCP</text>

    <!-- amount, well below the flap tip -->
    <text x="130" y="110" text-anchor="middle"
          font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="300"
          font-size="34" fill="#d98b5f">Rp 5.000.000</text>

    <!-- divider above caption -->
    <line x1="92" y1="124" x2="168" y2="124" stroke="#8a8178" stroke-width="0.5" opacity="0.5"/>

    <!-- caption -->
    <text x="130" y="140" text-anchor="middle"
          font-family="ui-monospace, Menlo, monospace" font-size="8.5" fill="#8a8178" letter-spacing="2">TABUNGAN</text>
  </g>

  <!-- Footer strip -->
  <line x1="30" y1="232" x2="610" y2="232" stroke="#e8dfd3" stroke-width="0.5" opacity="0.18"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8a8178" letter-spacing="1.5">
    <text x="30" y="252">TOTAL · 13.600.000</text>
    <text x="320" y="252" text-anchor="middle">·</text>
    <text x="610" y="252" text-anchor="end">EVERY RUPIAH HAS A JOB</text>
  </g>
</svg>
